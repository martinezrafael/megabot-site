<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contato | megabot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.ico" sizes="32x32">
</head>
<body>
<header>
        <div class="w bar">
            <a class="brand" href="/" aria-label="megabot, página inicial">
                <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
                    <rect width="40" height="40" rx="11" fill="#0F766E" />
                    <path d="M10 14a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v9a4 4 0 0 1-4 4h-7l-6 5v-5h-1a4 4 0 0 1-2-3z"
                        fill="#fff" />
                    <circle cx="16.5" cy="18" r="1.9" fill="#0F766E" />
                    <circle cx="23.5" cy="18" r="1.9" fill="#0F766E" />
                    <circle cx="31" cy="9" r="4" fill="#F59E0B" />
                </svg>
                megabot
            </a>
            <nav class="menu" aria-label="Principal">
                <a href="/#como-funciona">Como funciona</a>
                <a href="/#planos">Planos</a>
                <a href="/#perguntas">Perguntas</a>
                <a class="btn" href="/#testar">Testar grátis</a>
            </nav>
        </div>
    </header>

    <main class="page-section">
        <div class="w-narrow">
            <h1>Contato</h1>
            <p style="margin-bottom:28px">Tem dúvidas sobre os planos, quer agendar uma demonstração ou precisa de suporte? Preencha o formulário abaixo.</p>

            <div class="card">
                <form class="hs-form" data-hubspot-form="contact" data-success-msg="Mensagem enviada com sucesso! Responderemos em breve.">
                    <div class="hs-field">
                        <label for="contact-name">Nome completo</label>
                        <input id="contact-name" name="firstname" type="text" required placeholder="Seu nome">
                    </div>
                    <div class="hs-field">
                        <label for="contact-email">E-mail</label>
                        <input id="contact-email" name="email" type="email" required placeholder="voce@empresa.com.br">
                    </div>
                    <div class="hs-field">
                        <label for="contact-phone">Telefone / WhatsApp</label>
                        <input id="contact-phone" name="hs_whatsapp_phone_number" type="tel" placeholder="(11) 99999-9999">
                    </div>
                    <div class="hs-field">
                        <label for="contact-subject">Assunto</label>
                        <select id="contact-subject" name="subject">
                            <option value="duvidas_comerciais_e_planos">Dúvidas comerciais e planos</option>
                            <option value="suporte_tecnico">Suporte técnico</option>
                            <option value="solicitacao_de_privacidade">Solicitação de privacidade (LGPD)</option>
                            <option value="outro_assunto">Outro assunto</option>
                        </select>
                    </div>
                    <div class="hs-field">
                        <label for="contact-message">Mensagem</label>
                        <textarea id="contact-message" name="message" rows="4" required placeholder="Como podemos ajudar a sua loja?"></textarea>
                    </div>
                    <button class="btn" type="submit">Enviar mensagem</button>
                    <p class="hs-status" role="status"></p>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/env.js"></script>
    <script src="assets/js/ga.js"></script>
    <script src="assets/js/hubspot.js"></script>
    <script src="assets/js/menu.js"></script>
</body>
</html>
